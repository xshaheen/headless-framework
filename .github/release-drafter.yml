name-template: "$RESOLVED_VERSION"
tag-template: "$RESOLVED_VERSION"
change-template: "- $TITLE by @$AUTHOR (#$NUMBER)"
no-changes-template: "- No changes"
categories:
  - title: "🚀 Features"
    labels:
      - enhancement
  - title: "🐛 Fixes"
    labels:
      - bug
  - title: "📚 Documentation"
    labels:
      - documentation
  - title: "🧰 Maintenance"
    labels:
      - maintenance
version-resolver:
  # Before 1.0, SemVer reserves the major number: a breaking change bumps the minor version, so the
  # `major` label resolves to a minor bump. Move `major` back under its own key when 1.0 ships.
  minor:
    labels:
      - minor
      - major
  patch:
    labels:
      - patch
  default: patch
template: |
  $CHANGES

  ## Contributors

  $CONTRIBUTORS
# Labels come from the Conventional Commit title, not changed paths: a PR lands in every category it has a
# label for, so path rules put a `fix` that touches src/ under Features too. The `!` marker sets `major`,
# which drives the version bump. The autolabeler only adds labels, so a label for a title type that was
# later edited away stays until it is removed by hand.
autolabeler:
  - label: major
    title:
      - '/^\w+(\([^)]*\))?!:/'
  - label: enhancement
    title:
      - '/^(feat|perf)(\([^)]*\))?!?:/'
  - label: bug
    title:
      - '/^fix(\([^)]*\))?!?:/'
  - label: documentation
    title:
      - '/^docs(\([^)]*\))?!?:/'
  - label: maintenance
    title:
      - '/^(refactor|build|ci|chore|style|test)(\([^)]*\))?!?:/'
