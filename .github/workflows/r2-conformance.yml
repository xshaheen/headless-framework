name: R2 Conformance

# Runs the Cloudflare R2 blob conformance suite against a real R2 account. There is no R2 emulator, so this is
# gated on credentials supplied as repository/environment secrets. This workflow intentionally does not run on
# pull_request events because it executes code with real R2 credentials. CI calls it for a published release (or a
# dispatch that opts in to release checks); run it manually after reviewing any other branch.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  HUSKY: 0

jobs:
  r2-conformance:
    # Under CI this renders as "Release · R2 conformance / Cloudflare R2 suite".
    name: "Cloudflare R2 suite"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    # The R2 credentials live in this protected environment. The job runs without them too (suite self-skips).
    environment:
      name: "R2 Conformance"

    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up .NET SDK"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: "./global.json"

      # Restore-only: CI's primary build leg is the single writer of this cache key.
      - name: "Restore NuGet cache"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', 'global.json', 'dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "Restore test project"
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make restore-project PROJECT=tests/Headless.Blobs.CloudflareR2.Tests.Integration/Headless.Blobs.CloudflareR2.Tests.Integration.csproj

      - name: "Build test project"
        run: make build-project-no-restore PROJECT=tests/Headless.Blobs.CloudflareR2.Tests.Integration/Headless.Blobs.CloudflareR2.Tests.Integration.csproj

      - name: "Run R2 conformance suite"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: make test-project-fast TEST_PROJECT=tests/Headless.Blobs.CloudflareR2.Tests.Integration/Headless.Blobs.CloudflareR2.Tests.Integration.csproj
        shell: bash
