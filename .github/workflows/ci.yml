name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_checks:
        description: "Also run the release-only checks (pack + SBOM, messaging and R2 conformance) without publishing"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Disable the .NET logo in the console output.
  DOTNET_NOLOGO: true
  # Disable the .NET first time experience to skip caching NuGet packages and speed up the build.
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending .NET CLI telemetry to Microsoft.
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Set the build number in MinVer.
  MINVERBUILDMETADATA: build.${{ github.run_number }}
  # Build Configuration
  CONFIGURATION: Release
  # Packages Directory
  PACKAGES_DIR: ./artifacts/packages-results
  # Test Results Directory
  TEST_RESULTS_DIR: ./artifacts/test-results
  # Disable the Husky pre-commit hooks.
  HUSKY: 0

jobs:
  changes:
    name: "Select checks"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dotnet: ${{ steps.changes.outputs.dotnet }}
      dashboards: ${{ steps.changes.outputs.dashboards }}
      tus: ${{ steps.changes.outputs.tus }}
    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Verify check selection"
        run: bash scripts/test-ci-changes.sh

      - name: "Select checks from changed paths"
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci-changes.sh >> "$GITHUB_OUTPUT"

  format:
    name: "Lint · C# formatting"
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: "Set up .NET SDK"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: "./global.json"

      - name: "Check C# formatting (CSharpier)"
        run: make format-check

  # The analyzer quality gate. Roslyn analyzers are over half of the compiler's CPU on this 4-vCPU runner, so the
  # test job builds with -p:RunAnalyzers=false (source generators still run; compiler output is unaffected) and this
  # job builds the same solution with every analyzer in parallel. CI treats warnings as errors in both builds.
  analyzers:
    name: "Lint · .NET analyzers"
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          # MinVer derives the version from tags and commit height.
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up .NET SDK"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: "./global.json"

      - name: "Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/Headless.Jobs.Dashboard/wwwroot/package-lock.json
            src/Headless.Messaging.Dashboard/wwwroot/package-lock.json

      - name: "Restore NuGet cache"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', 'global.json', 'dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Same token isolation as the build job: npm lifecycle scripts run before the NuGet token exists.
      - name: "Build dashboard SPAs"
        run: make -j2 --output-sync=target dashboards DASHBOARD_BUILD_SCRIPT=build-only

      - name: "Build solution with analyzers"
        env:
          BuildDashboardSpa: "false"
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make rebuild

  dashboards:
    name: "Frontend · ${{ matrix.name }} dashboard"
    needs: changes
    if: needs.changes.outputs.dashboards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Jobs
            path: src/Headless.Jobs.Dashboard/wwwroot
          - name: Messaging
            path: src/Headless.Messaging.Dashboard/wwwroot
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: "Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: "Install dependencies"
        run: npm ci --no-audit --no-fund

      - name: "Type-check and build"
        run: npm run build

      - name: "Run unit tests (Vitest)"
        run: npm run test:unit

      - name: "Lint (ESLint)"
        run: npm run lint:check

  tus-demo:
    name: "Frontend · Tus demo"
    needs: changes
    if: needs.changes.outputs.tus == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: demo/Headless.Tus.Demo/frontend
    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: "Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/Headless.Tus.Demo/frontend/package-lock.json

      - name: "Install dependencies"
        run: npm ci --no-audit --no-fund

      - name: "Build frontend"
        run: npm run build

  build:
    name: ".NET · Build & unit tests (${{ matrix.tz }})"
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # UTC is the primary leg: it is the only NuGet cache writer and collects coverage on ordinary main pushes.
        # Coverage instrumentation adds start-up cost to every test module (~0.4s each serially, roughly a minute
        # per run on this runner) and nothing on a pull request or release path gates on it, so those paths skip it.
        #
        # Africa/Cairo is a release-only leg. GitHub runners are UTC, so a UTC-only pipeline structurally cannot
        # catch a local-offset bug: code that trusts DateTime.Kind, calls ToUniversalTime() on an Unspecified
        # value, or builds a DateTimeOffset from a bare DateTime behaves identically on a UTC box and silently
        # shifts by the offset everywhere else. That is exactly how the AWS LastModified defect survived. Cairo
        # (UTC+2/+3) is also DST-observing. Keeping it off pull requests trades PR time for catching such a
        # regression at release (or on a release_checks dispatch) instead of before merge.
        #
        # The axis itself is computed because `include` cannot drop a leg: an include entry that matches no
        # combination is added as a new one.
        tz: ${{ fromJSON((github.event_name == 'release' || inputs.release_checks) && '["UTC", "Africa/Cairo"]' || '["UTC"]') }}
    env:
      PRIMARY: ${{ matrix.tz == 'UTC' }}
      COVERAGE: ${{ matrix.tz == 'UTC' && github.event_name != 'pull_request' && !(github.event_name == 'release' || inputs.release_checks == true) }}
    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          # MinVer derives the version from tags and commit height.
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up .NET SDK"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: "./global.json"

      - name: "Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/Headless.Jobs.Dashboard/wwwroot/package-lock.json
            src/Headless.Messaging.Dashboard/wwwroot/package-lock.json

      # Restore and save are split so there is no post-job cache step (the combined action spent ~15s there
      # even on a primary-key hit) and only the primary leg writes. The cache lives outside the workspace and
      # is keyed on the lock files, which pin the exact package set.
      - name: "Restore NuGet cache"
        id: nuget-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', 'global.json', 'dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Build the dashboard SPAs BEFORE the NuGet token is present, so a malicious dependency lifecycle script
      # run by `npm ci` cannot read it. The token-bearing build below runs with BuildDashboardSpa=false and
      # only embeds the already-built wwwroot/dist.
      - name: "Build dashboard SPAs"
        run: make -j2 --output-sync=target dashboards DASHBOARD_BUILD_SCRIPT=build-only

      - name: "Build solution"
        # Analyzers run in the parallel "Lint · .NET analyzers" job, so they are skipped on the path to the tests.
        # GITHUB_PACKAGES_TOKEN is scoped to this restore/build step only and is expanded from nuget.config's
        # %GITHUB_PACKAGES_TOKEN% credential entry.
        env:
          BuildDashboardSpa: "false"
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make rebuild MSBUILD_ARGS=-p:RunAnalyzers=false

      - name: "Save NuGet cache"
        if: env.PRIMARY == 'true' && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      # A static name: GitHub shows a step-name expression unevaluated until the step starts.
      - name: "Run unit tests"
        env:
          TZ: ${{ matrix.tz }}
          CI_COVERAGE: ${{ env.COVERAGE }}
        run: make ci-test

      - name: "Generate coverage report"
        if: always() && env.COVERAGE == 'true'
        run: |
          set -euo pipefail

          if [ -z "$(find "${TEST_RESULTS_DIR}" -name '*.cobertura.xml' -print -quit 2>/dev/null)" ]; then
            echo "::warning::No Cobertura coverage files were found under ${TEST_RESULTS_DIR}."
            exit 0
          fi

          dotnet tool restore
          dotnet reportgenerator \
            -reports:"${TEST_RESULTS_DIR}/**/*.cobertura.xml" \
            -targetdir:"./artifacts/coverage/report" \
            -reporttypes:"Html;JsonSummary;MarkdownAssembliesSummary"
          # MarkdownAssembliesSummary writes Summary.md: one line/branch row per assembly (~8 KB).
          cat ./artifacts/coverage/report/Summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ env.PRIMARY == 'true' && 'utc' || 'africa-cairo' }}
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test-results/**/*.dmp
            artifacts/test-results/**/*.crash.sequence.log
          if-no-files-found: warn
          retention-days: 14

      - name: "Upload coverage report"
        if: always() && env.COVERAGE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-results
          path: |
            artifacts/test-results/**/*.cobertura.xml
            artifacts/test-results/**/*.coverage
            artifacts/coverage/report/**
          if-no-files-found: warn
          retention-days: 14

  pack:
    name: ".NET · Build & pack"
    if: github.event_name == 'release' || inputs.release_checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          # MinVer derives the version from tags and commit height.
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up .NET SDK"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: "./global.json"

      - name: "Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/Headless.Jobs.Dashboard/wwwroot/package-lock.json
            src/Headless.Messaging.Dashboard/wwwroot/package-lock.json

      - name: "Restore NuGet cache"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', 'global.json', 'dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Build the dashboard SPAs before the NuGet token exists, then embed the dist output during build.
      - name: "Build dashboard SPAs"
        run: make -j2 --output-sync=target dashboards DASHBOARD_BUILD_SCRIPT=build-only

      - name: "Build solution"
        env:
          BuildDashboardSpa: "false"
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make rebuild MSBUILD_ARGS=-p:RunAnalyzers=false

      - name: "Pack NuGet packages with SBOMs"
        env:
          BuildDashboardSpa: "false"
        run: make pack-built

      - name: "Verify packages"
        run: make verify-packages

      - name: "Upload packages"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-results
          path: ${{ env.PACKAGES_DIR }}
          if-no-files-found: error

  messaging-conformance:
    name: "Release · Messaging conformance"
    if: github.event_name == 'release' || inputs.release_checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          # MinVer derives the version from tags and commit height.
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up .NET SDK"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: "./global.json"

      - name: "Restore NuGet cache"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', 'global.json', 'dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "Build broker conformance suites"
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Analyzer coverage comes from the "Lint · .NET analyzers" job.
        run: make build-messaging-conformance-evidence MSBUILD_ARGS=-p:RunAnalyzers=false

      - name: "Run broker conformance scenarios"
        run: make ci-messaging-conformance-evidence

      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-messaging-conformance
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test-results/**/*.dmp
            artifacts/test-results/**/*.crash.sequence.log
          if-no-files-found: warn
          retention-days: 14

  r2-conformance:
    name: "Release · R2 conformance"
    if: github.event_name == 'release' || inputs.release_checks
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/r2-conformance.yml
    secrets: inherit

  # The single required status check for `main`. Unaffected and release-only jobs may skip; failures and
  # cancellations (including check selection) fail the gate. Every validation job must be listed in needs.
  ci-status:
    name: "CI status"
    if: always()
    needs: [ changes, format, analyzers, dashboards, tus-demo, build, pack, messaging-conformance, r2-conformance ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Check job results"
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          {
            echo "| Job | Result |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"

          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<<"$NEEDS" >/dev/null; then
            echo "::error::At least one CI job failed or was cancelled."
            exit 1
          fi

  publish-github-packages:
    name: "Release · Publish to GitHub Packages"
    needs: ci-status
    runs-on: ubuntu-latest
    # Publishing a GitHub Release is the explicit package-release gate.
    if: github.event_name == 'release'

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    environment:
      name: "GitHub Packages"
      url: https://github.com/xshaheen/headless-framework/packages

    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up .NET SDK"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: "./global.json"

      - name: "Download packages"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packages-results
          path: ${{ env.PACKAGES_DIR }}

      - name: "Verify packages"
        run: make verify-packages

      - name: "Attest package provenance"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "${{ env.PACKAGES_DIR }}/*.nupkg"

      # Advisory preflight only. A publish race still fails because push does not use --skip-duplicate.
      - name: "Check versions are not yet on NuGet.org"
        run: make nuget-publish-preflight

      - name: "Push to GitHub Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_PARALLELISM: "4"
        run: |
          set -euo pipefail
          count=$(find "${PACKAGES_DIR}" -maxdepth 1 -type f -name '*.nupkg' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No .nupkg files found in the downloaded package artifact."
            exit 1
          fi

          find "${PACKAGES_DIR}" -maxdepth 1 -type f -name '*.nupkg' -print0 | \
            xargs -0 -P "$PUSH_PARALLELISM" -n1 dotnet nuget push \
              --source "https://nuget.pkg.github.com/xshaheen/index.json" \
              --api-key "$GITHUB_TOKEN"

  publish-nuget-packages:
    name: "Release · Publish to NuGet.org"
    needs: publish-github-packages
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    permissions:
      contents: read
      id-token: write # Request the GitHub OIDC token exchanged for a short-lived nuget.org key (Trusted Publishing).

    environment:
      name: "NuGet Release"
      url: https://www.nuget.org/packages?q=Headless.

    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up .NET SDK"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: "./global.json"

      - name: "Download packages"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packages-results
          path: ${{ env.PACKAGES_DIR }}

      - name: "Verify packages"
        run: make verify-packages

      # Exchange the workflow OIDC token for a temporary nuget.org API key (valid ~1h, one key per token).
      # Requires a Trusted Publishing policy on nuget.org bound to this repo, the workflow file (ci.yml), and
      # the "NuGet Release" environment, plus a NUGET_USER secret holding the nuget.org account (profile) name.
      # No long-lived publishing secret is stored.
      - name: "Log in to NuGet.org (OIDC → short-lived API key)"
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: "Push to NuGet.org"
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PUSH_PARALLELISM: "4"
        run: |
          set -euo pipefail
          count=$(find "${PACKAGES_DIR}" -maxdepth 1 -type f -name '*.nupkg' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No .nupkg files found in the downloaded package artifact."
            exit 1
          fi

          find "${PACKAGES_DIR}" -maxdepth 1 -type f -name '*.nupkg' -print0 | \
            xargs -0 -P "$PUSH_PARALLELISM" -n1 dotnet nuget push \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "$NUGET_API_KEY"
