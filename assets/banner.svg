<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">.NET Headless Framework banner</title>
  <desc id="desc">The Headless logo beside five lines of setup code for caching, blobs, emails, distributed locks and messaging. Every line has the same shape, and the provider call in each one sits in a highlighted block.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .name { font-size: 48px; font-weight: 800; fill: #ededf3; letter-spacing: -1px; }
      .name-light { font-size: 48px; font-weight: 400; fill: #b4b4c6; letter-spacing: -1px; }
      .tagline { font-size: 22px; font-weight: 400; fill: #b4b4c6; }
      .label { font-size: 16px; font-weight: 500; fill: #7f7f96; }
      .code { font-size: 24px; font-weight: 500; fill: #7f7f96; }
      .call { fill: #b4b4c6; }
      .feature { fill: #ededf3; font-weight: 600; }
      .seated { font-size: 24px; font-weight: 700; fill: #120f2b; }
    </style>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="1310" cy="286" r="560">
      <stop offset="0" stop-color="#9d8cff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9d8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15151e"/>
      <stop offset="1" stop-color="#0f0f16"/>
    </linearGradient>
    <clipPath id="panel-clip">
      <rect x="516" y="64" width="1000" height="392" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1600" height="520" fill="#09090d"/>
  <rect width="1600" height="520" fill="url(#glow)"/>

  <!-- Logo lockup -->
  <g transform="translate(90.8 50.8) scale(1.1)">
    <rect x="12" y="12" width="22" height="72" rx="6" fill="#ededf3"/>
    <rect x="62" y="12" width="22" height="72" rx="6" fill="#ededf3"/>
    <rect x="38" y="38" width="20" height="20" rx="4" fill="#9d8cff"/>
  </g>
  <text class="sans name" x="103" y="216">Headless</text>
  <text class="sans name-light" x="103" y="268">Framework</text>

  <text class="sans tagline" x="104" y="390">Production backend infrastructure</text>
  <text class="sans tagline" x="104" y="420">for .NET, without a framework</text>
  <text class="sans tagline" x="104" y="450">taking over your app.</text>

  <!-- One grammar, five domains: the prefixes end on one edge so the provider blocks line up -->
  <rect x="516" y="64" width="1000" height="392" rx="24" fill="url(#panel)"/>
  <g clip-path="url(#panel-clip)">
    <rect x="516" y="64" width="1000" height="52" fill="#181822"/>
    <rect x="516" y="115.25" width="1000" height="1.5" fill="#262633"/>
  </g>
  <rect x="516" y="64" width="1000" height="392" rx="24" fill="none" stroke="#262633" stroke-width="1.5"/>

  <rect x="548" y="83" width="14" height="14" rx="3.5" fill="#9d8cff"/>
  <text class="mono label" x="574" y="96">Program.cs</text>
  <text class="sans label" x="1484" y="96" text-anchor="end">One grammar, every domain</text>

  <g class="mono code" text-anchor="end">
    <text x="1170" y="174" textLength="489.6" lengthAdjust="spacingAndGlyphs"><tspan class="call">AddHeadless</tspan><tspan class="feature">Caching</tspan>(setup =&gt; setup.</text>
    <text x="1170" y="234" textLength="460.8" lengthAdjust="spacingAndGlyphs"><tspan class="call">AddHeadless</tspan><tspan class="feature">Blobs</tspan>(setup =&gt; setup.</text>
    <text x="1170" y="294" textLength="475.2" lengthAdjust="spacingAndGlyphs"><tspan class="call">AddHeadless</tspan><tspan class="feature">Emails</tspan>(setup =&gt; setup.</text>
    <text x="1170" y="354" textLength="619.2" lengthAdjust="spacingAndGlyphs"><tspan class="call">AddHeadless</tspan><tspan class="feature">DistributedLocks</tspan>(setup =&gt; setup.</text>
    <text x="1170" y="414" textLength="518.4" lengthAdjust="spacingAndGlyphs"><tspan class="call">AddHeadless</tspan><tspan class="feature">Messaging</tspan>(setup =&gt; setup.</text>
  </g>

  <g fill="#9d8cff">
    <rect x="1182" y="145" width="198" height="42" rx="10"/>
    <rect x="1182" y="205" width="184" height="42" rx="10"/>
    <rect x="1182" y="265" width="198" height="42" rx="10"/>
    <rect x="1182" y="325" width="184" height="42" rx="10"/>
    <rect x="1182" y="385" width="256" height="42" rx="10"/>
  </g>

  <g class="mono seated">
    <text x="1202" y="174" textLength="158.4" lengthAdjust="spacingAndGlyphs">UseHybrid()</text>
    <text x="1202" y="234" textLength="144" lengthAdjust="spacingAndGlyphs">UseAzure()</text>
    <text x="1202" y="294" textLength="158.4" lengthAdjust="spacingAndGlyphs">UseAwsSes()</text>
    <text x="1202" y="354" textLength="144" lengthAdjust="spacingAndGlyphs">UseRedis()</text>
    <text x="1202" y="414" textLength="216" lengthAdjust="spacingAndGlyphs">UsePostgreSql()</text>
  </g>

  <g class="mono code">
    <text x="1390" y="174" textLength="28.8" lengthAdjust="spacingAndGlyphs">);</text>
    <text x="1376" y="234" textLength="28.8" lengthAdjust="spacingAndGlyphs">);</text>
    <text x="1390" y="294" textLength="28.8" lengthAdjust="spacingAndGlyphs">);</text>
    <text x="1376" y="354" textLength="28.8" lengthAdjust="spacingAndGlyphs">);</text>
    <text x="1448" y="414" textLength="28.8" lengthAdjust="spacingAndGlyphs">);</text>
  </g>
</svg>
